spring:
  application:
    name: account-service
  datasource:
    url: ${ACCOUNT_DB_URL:jdbc:h2:file:./data/accounts;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${ACCOUNT_DB_USER:sa}
    password: ${ACCOUNT_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
server:
  port: ${SERVER_PORT:8081}
management.endpoints.web.exposure.include: health,info,metrics
