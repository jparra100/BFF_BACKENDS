spring:
  application.name: payment-service
  config.import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  security.oauth2.resourceserver.jwt.issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8180/realms/banco-xyz}
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:h2:file:./data/payments;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${PAYMENT_DB_USER:sa}
    password: ${PAYMENT_DB_PASSWORD:}
  jpa:
    hibernate.ddl-auto: update
    open-in-view: false
server.port: ${SERVER_PORT:8082}
management.endpoints.web.exposure.include: health,info,metrics
eureka.client:
  enabled: ${EUREKA_ENABLED:false}
  service-url.defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
app.security.enabled: ${SECURITY_ENABLED:false}
