eureka:
  client:
    enabled: true
    service-url.defaultZone: ${EUREKA_URL:http://discovery-server:8761/eureka/}
spring.security.oauth2.resourceserver.jwt.issuer-uri: ${OAUTH2_ISSUER_URI:http://keycloak:8080/realms/banco-xyz}
app.security.enabled: true
management.endpoints.web.exposure.include: health,info,metrics
