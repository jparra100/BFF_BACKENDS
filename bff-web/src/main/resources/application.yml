spring:
  application:
    name: bff-web
  config.import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

server:
  port: 8441
  ssl:
    enabled: true
    key-store: ${WEB_SSL_KEYSTORE:file:certs/bff-web.p12}
    key-store-type: PKCS12
    key-store-password: ${WEB_SSL_KEYSTORE_PASSWORD}
    key-alias: bff-web

app:
  security:
    mode: ${SECURITY_MODE:local}
    username: ${WEB_AUTH_USERNAME:web-user}
    password: ${WEB_AUTH_PASSWORD}
    jwt-secret-base64: ${JWT_SECRET_BASE64}
    issuer: bff-backends
    channel: WEB
    role: WEB
    token-ttl: 15m
  remote-services.enabled: ${REMOTE_SERVICES_ENABLED:false}

eureka.client:
  enabled: ${EUREKA_ENABLED:false}
  service-url.defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
management.endpoints.web.exposure.include: health,info,metrics
